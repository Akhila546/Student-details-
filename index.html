<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Record Manager</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,sans-serif;min-height:100vh;background:linear-gradient(135deg,#101827,#18243a);color:#f4f7fb;padding:30px 15px}
.container{width:100%;max-width:950px;margin:auto}
h1{text-align:center;margin-bottom:8px;font-size:32px}
.subtitle{text-align:center;color:#aebbd0;margin-bottom:25px}
.card{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);border-radius:18px;padding:22px;margin-bottom:20px}
h2{margin-bottom:15px;font-size:21px}
textarea{width:100%;min-height:180px;resize:vertical;padding:15px;border-radius:12px;border:1px solid #46556e;background:#0d1522;color:#fff;font-size:15px;line-height:1.7;outline:none}
textarea:focus{border-color:#79a7ff}
.buttons{display:flex;gap:12px;flex-wrap:wrap;margin-top:15px}
button{border:0;border-radius:10px;padding:12px 20px;font-size:15px;font-weight:bold;cursor:pointer}
#processBtn{background:#4f8cff;color:white}#resetBtn{background:#36445b;color:white}
button:hover{opacity:.9}
.summary{display:grid;grid-template-columns:repeat(2,1fr);gap:15px;margin-bottom:20px}
.stat{text-align:center;padding:18px;border-radius:14px;background:#121d2d;border:1px solid #34445c}
.stat-number{font-size:30px;font-weight:bold;margin-bottom:5px}
.valid-number{color:#67d391}.invalid-number{color:#ff7d87}
.record{padding:16px;border-radius:12px;margin-bottom:12px;border-left:5px solid}
.record.valid{background:rgba(67,190,122,.1);border-left-color:#67d391}
.record.invalid{background:rgba(255,90,105,.1);border-left-color:#ff7d87}
.status{font-weight:bold;margin-bottom:8px}.valid .status{color:#67d391}.invalid .status{color:#ff7d87}
.reason{color:#ff7d87;font-weight:bold;font-size:17px;margin-bottom:6px}
.data{color:#bdc9da;word-break:break-word}
.saved-record{background:#101a29;border:1px solid #30415a;padding:12px;border-radius:9px;margin-bottom:8px;word-break:break-word}
.empty{color:#aebbd0;text-align:center;padding:15px}
.footer{text-align:center;color:#7f8da3;font-size:13px;margin-top:20px}
@media(max-width:600px){h1{font-size:26px}.summary{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="container">
<h1>Student Record Manager</h1>
<p class="subtitle">Validate, process and save student records</p>
<div class="card">
<h2>Input Student Records</h2>
<textarea id="inputData">101|Akhila|akhila@gmail.com|20
102|Harsha123|harsha@gmail.com|21
103|Ravi|ravi@yahoo.com|19
ABC|Kiran|kiran@gmail.com|22
105|Meena|meena@gmail.com|150</textarea>
<div class="buttons">
<button id="processBtn" type="button">Process Records</button>
<button id="resetBtn" type="button">Reset Sample Data</button>
</div>
</div>
<div class="summary">
<div class="stat"><div id="validCount" class="stat-number valid-number">0</div><div>Valid Records</div></div>
<div class="stat"><div id="invalidCount" class="stat-number invalid-number">0</div><div>Invalid Records</div></div>
</div>
<div class="card"><h2>Validation Results</h2><div id="results"></div></div>
<div class="card"><h2>Saved Student Records</h2><p id="saveMessage" class="empty">No records processed yet.</p><div id="savedRecords"></div></div>
<p class="footer">GitHub Pages compatible • Single HTML file • No Python required</p>
</div>
<script>
"use strict";
const sampleData=`101|Akhila|akhila@gmail.com|20
102|Harsha123|harsha@gmail.com|21
103|Ravi|ravi@yahoo.com|19
ABC|Kiran|kiran@gmail.com|22
105|Meena|meena@gmail.com|150`;
const inputData=document.getElementById("inputData");
const processBtn=document.getElementById("processBtn");
const resetBtn=document.getElementById("resetBtn");
const results=document.getElementById("results");
const savedRecords=document.getElementById("savedRecords");
const validCount=document.getElementById("validCount");
const invalidCount=document.getElementById("invalidCount");
const saveMessage=document.getElementById("saveMessage");

function validateStudent(rollNo,name,email,age){
 if(!/^\d+$/.test(rollNo)) return "INVALID ROLL NUMBER";
 if(!name.trim() || !/^[A-Za-z ]+$/.test(name)) return "INVALID NAME";
 if(!/^[a-zA-Z0-9._%+-]+@gmail\.com$/.test(email)) return "INVALID EMAIL";
 if(!/^\d+$/.test(age) || Number(age)<1 || Number(age)>100) return "INVALID AGE";
 return null;
}
function add(tag,cls,text){
 const e=document.createElement(tag);
 if(cls)e.className=cls;
 if(text!==undefined)e.textContent=text;
 return e;
}
function processRecords(){
 results.innerHTML="";
 savedRecords.innerHTML="";
 const lines=inputData.value.split(/\r?\n/);
 const validStudents=[];
 let invalidTotal=0, recordNumber=0;
 for(const originalLine of lines){
  const line=originalLine.trim();
  if(!line)continue;
  recordNumber++;
  const parts=line.split("|");
  if(parts.length!==4){
   invalidTotal++;
   const card=add("div","record invalid");
   card.appendChild(add("div","status",`Record ${recordNumber}: INVALID`));
   card.appendChild(add("div","reason","INVALID FORMAT"));
   card.appendChild(add("div","data",`Data: ${line}`));
   results.appendChild(card); continue;
  }
  const [rollNo,name,email,age]=parts.map(x=>x.trim());
  const error=validateStudent(rollNo,name,email,age);
  if(error){
   invalidTotal++;
   const card=add("div","record invalid");
   card.appendChild(add("div","status",`Record ${recordNumber}: INVALID`));
   card.appendChild(add("div","reason",error));
   card.appendChild(add("div","data",`Data: ${line}`));
   results.appendChild(card);
  }else{
   validStudents.push({rollNo,name,email,age});
   const card=add("div","record valid");
   card.appendChild(add("div","status",`Record ${recordNumber}: VALID`));
   card.appendChild(add("div","data",`Roll Number: ${rollNo} | Name: ${name} | Email: ${email} | Age: ${age}`));
   results.appendChild(card);
  }
 }
 validCount.textContent=validStudents.length;
 invalidCount.textContent=invalidTotal;
 if(validStudents.length){
  saveMessage.textContent="Only valid records are saved below (students.txt content).";
  validStudents.forEach(s=>savedRecords.appendChild(add("div","saved-record",`${s.rollNo}|${s.name}|${s.email}|${s.age}`)));
 }else saveMessage.textContent="No valid records were available to save.";
}
processBtn.addEventListener("click",processRecords);
resetBtn.addEventListener("click",()=>{
 inputData.value=sampleData;results.innerHTML="";savedRecords.innerHTML="";
 validCount.textContent="0";invalidCount.textContent="0";saveMessage.textContent="No records processed yet.";
});
processRecords();
</script>
</body>
</html>
